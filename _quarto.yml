project:
  type: website
  output-dir: docs
  resources:
    - robots.txt

website:
  title: "Desegpol"
  description: "Desegpol is a research project analysing the impact of school desegregation policies (Shock Plan and Admissions Decree) on the distribution of socially vulnerable students in Barcelona."
  site-url: "https://www.desegpol.com"
  cookie-consent: false
  open-graph: true
  twitter-card: true
  navbar:
    title: false
    logo: images/Desegpol_logo_transparent.png
    logo-alt: "Desegpol - School Desegregation Policies in Barcelona"
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: team.qmd
        text: Team
      - href: outputs.qmd
        text: Outputs
  page-footer:
    background: "#419E9C"
    left: '<span class="footer-brand">Desegpol</span> · School desegregation policies in the city of Barcelona'
    right: '&copy; 2025 Desegpol · GEPS – Universitat Autònoma de Barcelona'

format:
  html:
    theme: [cosmo, theme.scss]
    css: styles.css
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    toc: true
    lang: en

editor: visual

redirects:
  from: "http://desegpol.com"
  to: "https://www.desegpol.com"